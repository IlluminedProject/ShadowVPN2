services:
  shadowvpn2:
    build:
      context: .
      dockerfile: ShadowVPN2/Dockerfile
    container_name: shadowvpn2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - shadowvpn2-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:${SHADOWVPN_WEB_PORT:-5172}
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:${SHADOWVPN_WEB_PORT:-5172}/api/node/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  shadowvpn2-data:
    driver: local
