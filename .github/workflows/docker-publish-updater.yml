name: Publish updater Docker image

on:
    push:
        branches:
            - master
        paths:
            - 'ShadowVPN2.Updater/**'
            - 'ShadowVPN2.Contracts/**'
            - '.github/workflows/docker-publish-updater.yml'

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Determine image name
                id: image
                env:
                    REPOSITORY_OWNER: ${{ github.repository_owner }}
                run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/shadowvpn2-updater" >> "$GITHUB_OUTPUT"

            -   name: Generate image metadata
                id: metadata
                uses: docker/metadata-action@v5
                with:
                    images: ${{ steps.image.outputs.name }}
                    tags: |
                        type=raw,value=latest
                        type=sha,format=long

            -   name: Build and push updater image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: ShadowVPN2.Updater/Dockerfile
                    platforms: linux/amd64
                    push: true
                    tags: ${{ steps.metadata.outputs.tags }}
                    labels: ${{ steps.metadata.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
