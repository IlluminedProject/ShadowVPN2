services:
  shadowvpn2:
    build:
      context: .
      dockerfile: ShadowVPN2/Dockerfile
      target: dev
    container_name: shadowvpn2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - shadowvpn2-data:/data
      - .:/src:rw
      - ${USERPROFILE}/.nuget/packages:/root/.nuget/packages:rw
      - /src/ShadowVPN2/obj
      - /src/ShadowVPN2/bin
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:${SHADOWVPN_WEB_PORT:-5172}
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - SHADOWVPN_DATA_DIR=/data
      - DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH=1
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:${SHADOWVPN_WEB_PORT:-5172}/api/node/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  shadowvpn2-data:
    driver: local
