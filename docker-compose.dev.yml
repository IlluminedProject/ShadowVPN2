services:
  shadowvpn2:
    build:
      context: .
      dockerfile: ShadowVPN2/Dockerfile
      target: debug
    container_name: shadowvpn2
    stop_grace_period: 30s
    ports:
        - "${SHADOWVPN_WEB_PORT:-5172}:5172"
        - "8888:8888"
        - "4443:4443/udp"
        - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - shadowvpn2-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:${SHADOWVPN_WEB_PORT:-5172}
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - SHADOWVPN_DATA_DIR=/data
      - DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH=1
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:${SHADOWVPN_WEB_PORT:-5172}/api/node/status"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  shadowvpn2-data:
    driver: local
