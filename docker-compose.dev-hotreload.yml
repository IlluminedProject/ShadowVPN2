services:
  shadowvpn2:
    build:
      context: .
      dockerfile: ShadowVPN2/Dockerfile
      target: hotreload
    container_name: shadowvpn2
    stop_grace_period: 30s
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - shadowvpn2-data:/data
      - .:/src:rw
      - shadowvpn2-nuget:/root/.nuget/packages
      - shadowvpn2-contracts-obj:/src/ShadowVPN2.Contracts/obj
      - shadowvpn2-contracts-bin:/src/ShadowVPN2.Contracts/bin
      - shadowvpn2-frontend-obj:/src/ShadowVPN2.Frontend/obj
      - shadowvpn2-frontend-bin:/src/ShadowVPN2.Frontend/bin
      - shadowvpn2-obj:/src/ShadowVPN2/obj
      - shadowvpn2-bin:/src/ShadowVPN2/bin
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:${SHADOWVPN_WEB_PORT:-5172}
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - SHADOWVPN_DATA_DIR=/data
      - DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH=1
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:${SHADOWVPN_WEB_PORT:-5172}/api/node/status"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  shadowvpn2-data:
    driver: local
  shadowvpn2-nuget:
      driver: local
  shadowvpn2-contracts-obj:
      driver: local
  shadowvpn2-contracts-bin:
      driver: local
  shadowvpn2-frontend-obj:
      driver: local
  shadowvpn2-frontend-bin:
      driver: local
  shadowvpn2-obj:
      driver: local
  shadowvpn2-bin:
      driver: local
